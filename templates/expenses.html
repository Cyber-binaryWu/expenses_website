<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses</title>
    <link rel="stylesheet" href="static/styles.css">

</head>
<body>
    <h1>Expenses</h1>

        <h1>Add expense</h1>
        <div class="add_expense_container">
            <table>
                <tr>
                    <th>Name</th><th>Amount</th><th>Type</th><th>Date</th><button>Submit</button>
                </tr>
            </table>
        </div>
        
        <h1>Current Expenses:</h1>
        <div class="expense-container">
            <!-- Access your data by column names instead of [0] -->
             <table>
                    <tr>
                        <th>Name</th><th>Amount</th><th>Type</th> <th> Date</th> <th></th> <th></th>
                    </tr>
                    {% for expense in expenses %}
                    <tr>
                        <td>{{ expense['expense_name'] }}</td> 
                        <td> £{{ expense['expense_amount'] }} </td>
                        <td>{{ expense['expense_payment_type'] }}</td>
                        <td>{{ expense['expense_date'] }}</td>
                        <td><button>EDIT</button></td>
                        <td>  <!-- This form securely sends the specific row ID to Flask -->
                            <form action="{{ url_for('delete_expense', id=expense['expense_id']) }}" method="POST" style="display:inline;">
                                <button type="submit" onclick="return confirm('Are you sure you want to delete this expense?');">DELETE</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
            
        </div> 
</body>
</html>
